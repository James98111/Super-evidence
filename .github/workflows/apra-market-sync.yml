name: Refresh APRA market data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 20 2 * *'
  push:
    paths:
      - 'scripts/apra_market_sync.py'
      - '.github/workflows/apra-market-sync.yml'

permissions:
  contents: write

concurrency:
  group: apra-market-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build APRA market snapshot
        run: python scripts/apra_market_sync.py

      - name: Show snapshot summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/apra-market/funds-index.json'))
          print('reporting_period:', p['reporting_period'])
          print('fund_count:', p['fund_count'])
          print('managed_options:', sum(x['managed_options'] for x in p['funds']))
          print('direct_assets:', sum(x['direct_assets'] for x in p['funds']))
          print('total_option_records:', sum(x['total_option_records'] for x in p['funds']))
          PY

      - name: Commit refreshed public snapshot
        run: |
          if git diff --quiet -- data/apra-market; then
            echo 'No APRA market changes.'
            exit 0
          fi
          git config user.name 'super-evidence-bot'
          git config user.email '94504434+James98111@users.noreply.github.com'
          git add data/apra-market
          git commit -m 'Refresh APRA market snapshot'
          git push
