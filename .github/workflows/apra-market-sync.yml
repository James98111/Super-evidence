name: Refresh APRA market data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 20 2 * *'
  push:
    paths:
      - 'scripts/apra_structure_sync.py'
      - '.github/workflows/apra-market-sync.yml'

permissions:
  contents: write

concurrency:
  group: apra-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Build APRA product structure snapshot
        run: python scripts/apra_structure_sync.py

      - name: Show snapshot summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/apra-market/funds-index.json'))
          print('reporting_period:', p['reporting_period'])
          print('fund_count:', p['fund_count'])
          print('unique_managed_options:', p['unique_managed_options'])
          print('unique_direct_assets:', p['unique_direct_assets'])
          print('unique_options_total:', p['unique_options_total'])
          print('pathways:', p['pathways'])
          PY

      - name: Commit refreshed public snapshot
        run: |
          git add data/apra-market
          if git diff --cached --quiet; then
            echo 'No APRA market changes.'
            exit 0
          fi
          git config user.name 'super-evidence-bot'
          git config user.email '94504434+James98111@users.noreply.github.com'
          git commit -m 'Refresh APRA market snapshot'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
