name: Inspect 2026 APRA CPPP

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apra_cppp_inspect.py'
      - '.github/workflows/apra-cppp-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect CPPP CSVs
        run: python scripts/apra_cppp_inspect.py
      - name: Commit inspection
        run: |
          git add data/apra-market/cppp-2026-inspection.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'super-evidence-bot'
          git config user.email '94504434+James98111@users.noreply.github.com'
          git commit -m 'Inspect APRA 2026 CPPP CSV schemas'
          git push
