name: Super Evidence site QA

on:
  push:
    branches: ['main']
    paths:
      - 'app-v7.js'
      - 'core-v8.js'
      - 'workspace-v8.js'
      - 'v8/**'
      - 'tests/**'
      - 'styles-v7.css'
      - 'index.html'
      - 'data/apra-market/**'
      - '.github/workflows/site-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app-v7.js
          node --check core-v8.js
          node --check workspace-v8.js
          node --check v8/app.js
      - name: Economic analysis regression tests
        run: node tests/core-v8.test.mjs
      - name: V8 shell integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('v8/index.html').read_text(encoding='utf-8')
          css=Path('v8/styles.css').read_text(encoding='utf-8')
          js=Path('v8/app.js').read_text(encoding='utf-8')
          assert 'type="module" src="app.js"' in html
          assert 'My research' in html
          assert 'core-v8.js' in js and 'workspace-v8.js' in js
          assert 'question-grid' in css and 'research-detail' in css
          assert 'Search the market' in html
          print('V8 shell passed')
          PY
      - name: Market data integrity
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('data/apra-market')
          idx=json.load(open(root/'funds-index.json'))
          assert idx['fund_count'] >= 50, idx['fund_count']
          assert idx['unique_options_total'] >= 10000, idx['unique_options_total']
          stats=root/'market-stats.json'
          if stats.exists():
              s=json.load(open(stats))
              assert s['fund_entities'] == idx['fund_count']
              assert s['unique_option_records'] == idx['unique_options_total']
              assert 0 <= s['growth_exposure_min_pct'] <= s['growth_exposure_max_pct'] <= 150
              if s['growth_exposure_max_pct'] > 100:
                  print('INFO: market contains >100% growth exposure; consumer UI must label leveraged exposure explicitly')
          metrics=root/'option-metrics-index.json'
          if metrics.exists():
              m=json.load(open(metrics))['options']
              assert len(m) >= 500
              returns=[x['return_10y_pct'] for x in m if x.get('return_10y_pct') is not None]
              assert len(returns) >= 300
              assert all(-100 <= x <= 100 for x in returns)
          cppp=root/'cppp-2026.json'
          if cppp.exists():
              c=json.load(open(cppp))
              rows=c.get('records',[])
              assert len(rows) >= 700
              ten=[x for x in rows if x.get('return_10y_pct') is not None]
              assert len(ten) >= 300
          print('QA passed')
          PY
