<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Independent, easy-to-understand information about Australia's super funds and investment options." />
  <meta name="theme-color" content="#FBF8F4" />
  <title>Super Evidence — Understand Australian super with confidence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-v3.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <button class="brand" data-view="home" aria-label="Super Evidence home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>Super Evidence</strong><small>Independent Australian super research</small></span>
      </button>
      <nav class="desktop-nav" aria-label="Main navigation">
        <button data-view="funds" class="nav-link">Find a fund</button>
        <button data-view="compare" class="nav-link">Compare</button>
        <button data-view="calculators" class="nav-link">Calculators</button>
        <button data-view="learn" class="nav-link">Learn</button>
        <button data-view="about" class="nav-link">About</button>
      </nav>
      <button id="globalSearchButton" class="search-button" aria-haspopup="dialog" aria-label="Search super funds">
        <svg aria-hidden="true" viewBox="0 0 32 32"><use href="assets/icons.svg#search"></use></svg>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-shell">
      <div class="footer-brand">
        <span class="brand-mark small" aria-hidden="true"><span></span><span></span><span></span></span>
        <div><strong>Super Evidence</strong><p>Independent. Evidence-backed. Built for Australians.</p></div>
      </div>
      <nav aria-label="Footer navigation">
        <button data-view="about">About</button>
        <button data-view="learn">Methodology</button>
        <a href="#" aria-label="Privacy">Privacy</a>
        <a href="#" aria-label="Disclaimers">Disclaimers</a>
      </nav>
      <p class="footer-disclaimer">Factual information only. Not personal financial advice. Past performance is not a reliable indicator of future performance.</p>
      <p class="photo-credit">Homepage photography: Cabri Caldwell / Unsplash.</p>
    </div>
  </footer>

  <dialog id="searchDialog" class="search-dialog">
    <div class="dialog-head">
      <div>
        <span class="eyebrow">Search funds</span>
        <strong>Find a super fund</strong>
      </div>
      <button id="closeSearch" class="icon-button" aria-label="Close search">×</button>
    </div>
    <input id="dialogSearchInput" class="dialog-search-input" type="search" placeholder="Search Australian Retirement Trust, Aware Super..." autocomplete="off" />
    <div id="dialogSearchResults" class="dialog-results"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
