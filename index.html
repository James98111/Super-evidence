<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Evidence — Australian super, understood</title><style>
:root{--ink:#101820;--muted:#5d6973;--line:#d9dfe4;--soft:#f5f7f8;--navy:#0e3147;--blue:#076888;--max:1200px}*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--blue)}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.head{max-width:var(--max);height:66px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:28px}.brand{border:0;background:none;font-weight:800;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:9px}.mark{background:var(--navy);color:#fff;width:31px;height:31px;display:grid;place-items:center;font-size:10px}.nav{display:flex;gap:2px;flex:1}.nav button,.search-btn{border:0;background:none;padding:9px 10px;color:#394650}.nav button:hover,.search-btn:hover{background:var(--soft)}.search-btn{border:1px solid var(--line)}main{min-height:75vh}.page{max-width:var(--max);margin:auto;padding:42px 24px 70px}.narrow{max-width:900px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--blue);margin-bottom:8px}h1{font-size:44px;letter-spacing:-.035em;line-height:1.08;margin:0 0 14px}h2{font-size:25px;letter-spacing:-.02em;margin:0 0 10px}h3{font-size:17px;margin:0 0 6px}.lead{font-size:19px;color:#43515d;max-width:760px}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.05fr .75fr;gap:70px;padding:40px 0 52px;border-bottom:1px solid var(--line)}.hero h1{font-size:54px}.hero p{font-size:20px;color:#47545e}.searchbox input{width:100%;padding:15px 16px;border:1px solid #bac4cb;outline:0}.searchbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e7f1f4}.results{border:1px solid var(--line);border-top:0}.result{display:flex;justify-content:space-between;gap:15px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:var(--soft)}.result small{display:block;color:var(--muted)}.start{border-top:4px solid var(--navy);padding-top:18px}.start button{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:10px;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:15px 2px}.start button:hover{background:var(--soft)}.start b{display:block}.start small{color:var(--muted)}.section{padding:38px 0;border-bottom:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:18px}.section-head p{max-width:560px;margin:0;color:var(--muted)}.tasks{display:grid;grid-template-columns:repeat(3,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}.task{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px}.task button{border:0;background:none;text-align:left;padding:0;color:var(--ink)}.task p{font-size:13px;color:var(--muted);margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:800;color:#4a5660}.field input,.field select{min-height:42px;border:1px solid #bac4cb;background:#fff;padding:8px 10px}.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:10px 13px;font-weight:700}.btn.alt{background:#fff;color:var(--navy)}table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;border-bottom:2px solid #bcc5cc;padding:9px}td{padding:13px 9px;border-bottom:1px solid var(--line)}tbody tr:hover{background:var(--soft)}.primary{font-weight:750}.sub{font-size:12px;color:var(--muted)}.link{border:0;background:none;color:var(--blue);padding:0;font-weight:700}.notice{border-left:3px solid var(--blue);background:#f6fafb;padding:14px 16px;color:#43515d;font-size:13px}.crumb{font-size:12px;color:var(--muted);margin-bottom:20px}.crumb button{border:0;background:none;color:var(--blue);padding:0}.option-head{border-bottom:1px solid var(--line);padding-bottom:25px}.option-top{display:flex;justify-content:space-between;gap:25px}.option-summary{font-size:16px;max-width:900px;border-top:1px solid var(--line);padding-top:16px;margin-top:22px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:20px}.metric{padding:15px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.metric label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.metric strong{display:block;font-size:22px;margin:5px 0}.metric small{color:var(--muted)}details{border-top:1px solid var(--line)}details:last-child{border-bottom:1px solid var(--line)}summary{list-style:none;padding:17px 0;font-weight:800;cursor:pointer;display:flex;justify-content:space-between}summary:after{content:'+';font-size:20px;color:var(--muted)}details[open] summary:after{content:'–'}.detail{padding:0 0 22px}.rows{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:1.4fr 1fr auto;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}.row strong{font-variant-numeric:tabular-nums}.tag{font-size:10px;background:#edf5f2;color:#176046;padding:3px 5px}.compare-select{display:grid;grid-template-columns:1fr 45px 1fr;gap:12px;align-items:end;margin:24px 0}.vs{text-align:center;padding-bottom:11px;color:var(--muted)}.compare{border-top:2px solid var(--ink)}.crow{display:grid;grid-template-columns:200px 1fr 1fr;border-bottom:1px solid var(--line)}.crow div{padding:13px}.crow div+div{border-left:1px solid var(--line)}.crow .name{font-size:12px;color:var(--muted);font-weight:700}.crow strong{font-size:17px}.interpret{margin:22px 0;background:#edf5f8;border-left:4px solid var(--blue);padding:17px 18px}.wizard{border-top:3px solid var(--navy);margin-top:24px}.step{padding:20px 0;border-bottom:1px solid var(--line)}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid #bac4cb;background:#fff;padding:9px 11px}.choice:hover{border-color:var(--navy);background:var(--soft)}.saved{margin-top:28px}.saved div{display:grid;grid-template-columns:170px 1fr;padding:11px 0;border-bottom:1px solid var(--line)}.learn{display:grid;grid-template-columns:220px 1fr;gap:40px}.learn nav{border-right:1px solid var(--line)}.learn nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px 8px 0;color:#46535e}.learn nav button.active{font-weight:800;color:var(--navy)}.article{max-width:700px}.article p,.article li{font-size:16px;color:#43515d}.coverage{display:flex;gap:30px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}footer{background:var(--soft);border-top:1px solid var(--line)}.foot{max-width:var(--max);margin:auto;padding:25px 24px;font-size:12px;color:var(--muted)}dialog{width:min(720px,calc(100vw - 30px));border:0;padding:0;box-shadow:0 25px 80px #0004}dialog::backdrop{background:#07131c77}.dlg-head{display:flex;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}.dlg-head button{border:0;background:none;font-size:22px}.dlg-input{width:100%;border:0;border-bottom:1px solid var(--line);padding:17px;font-size:16px;outline:0}.dlg-results{max-height:420px;overflow:auto}@media(max-width:850px){.nav{display:none}.head{padding:0 16px}.search-btn{margin-left:auto}.page{padding:30px 17px 55px}.hero{grid-template-columns:1fr;gap:35px}.hero h1{font-size:42px}.tasks{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.compare-select{grid-template-columns:1fr}.vs{text-align:left;padding:0}.learn{grid-template-columns:1fr}.learn nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto}.learn nav button{white-space:nowrap}.crow{min-width:610px}.compare{overflow:auto}}@media(max-width:560px){h1{font-size:34px}.hero h1{font-size:38px}.hero p,.lead{font-size:17px}.metrics{grid-template-columns:1fr}.option-top{display:block}.option-top .btn{margin-top:12px}.row{grid-template-columns:1fr auto}.row span:last-child{display:none}.saved div{grid-template-columns:1fr}}
</style></head><body><header><div class="head"><button class="brand" data-go="home"><span class="mark">SE</span>Super Evidence</button><nav class="nav"><button data-go="my">My super</button><button data-go="compare">Compare</button><button data-go="rankings">Rankings</button><button data-go="funds">Funds</button><button data-go="learn">Learn</button></nav><button class="search-btn" id="searchOpen">Search</button></div></header><main id="app"></main><footer><div class="foot"><strong>Super Evidence</strong> — Independent, evidence-backed superannuation research. Factual information only; not personal financial advice.</div></footer><dialog id="searchDlg"><div class="dlg-head"><strong>Search Super Evidence</strong><button id="searchClose">×</button></div><input id="dlgInput" class="dlg-input" placeholder="Search a fund or investment option"><div id="dlgResults" class="dlg-results"></div></dialog><script>
let db,state={view:'home',option:null,compare:[],topic:'intro'},$=s=>document.querySelector(s),pct=v=>Number(v).toFixed(2).replace(/\.00$/,'')+'%',money=v=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(v),opt=id=>db.options.find(o=>o.id===id),funds=()=>[...new Map(db.options.map(o=>[o.fund,o])).values()],bal=()=>+localStorage.getItem('se_bal')||100000;
function fees(o,b){let c=o.costs,a=c.adminPercent.capBalance?Math.min(b,c.adminPercent.capBalance)*c.adminPercent.value/100:Math.min(b*c.adminPercent.value/100,c.adminPercent.annualCap||1e9),f=c.adminFixedAnnual.value,r=b*c.reservePercent.value/100,i=b*c.investmentAndTransactionPct.value/100;return{a,f,r,i,t:a+f+r+i}}
function go(v,x={}){state.view=v;if(x.option)state.option=x.option;if(x.fund)state.fund=x.fund;if(x.compare)state.compare=x.compare;render();scrollTo(0,0)}
function home(){return `<div class="page"><section class="hero"><div><div class="eyebrow">Australian super, made understandable</div><h1>Know what your super is doing — and how it compares.</h1><p>Find your fund, understand the investment option you actually own, compare it with genuinely similar options and trace important numbers back to public evidence.</p><div class="searchbox"><input id="homeQ" placeholder="Search your fund or investment option"><div id="homeResults"></div></div></div><aside class="start"><div class="eyebrow">Start here</div><h2>What do you want to do?</h2><button data-go="my"><span>01</span><div><b>Help me understand my super</b><small>Find your fund, option, fees and performance step by step.</small></div>→</button><button data-go="compare"><span>02</span><div><b>Compare super options</b><small>Put investment options side by side.</small></div>→</button><button data-go="rankings"><span>03</span><div><b>See the rankings</b><small>Find stronger returns or lower fees among comparable options.</small></div>→</button></aside></section><section class="section"><div class="section-head"><div><div class="eyebrow">Explore</div><h2>Everything in one place, without everything on one screen.</h2></div><p>The final platform is designed for every Australian super fund and every investment option. Depth lives underneath a simple navigation layer.</p></div><div class="tasks"><div class="task"><button data-go="funds"><h3>Browse all funds</h3><p>Start with a provider and drill into its products and options.</p></button></div><div class="task"><button data-go="rankings"><h3>Find strong performers</h3><p>Screen comparable options before ranking them.</p></button></div><div class="task"><button data-go="learn"><h3>Learn super as you go</h3><p>Plain-English explanations when and where you need them.</p></button></div></div></section><div class="coverage"><span><b>${funds().length}</b> funds loaded in prototype</span><span><b>${db.options.length}</b> options loaded</span><span>Target: complete market coverage</span><span>Every number requires evidence</span></div></div>`}
function my(){let saved=localStorage.getItem('se_opt'),o=saved?opt(saved):null;return `<div class="page narrow"><div class="eyebrow">My super</div><h1>Let's work out what you actually have.</h1><p class="lead">You do not need to know the jargon. Start with the fund name and we will narrow it down.</p><div class="wizard"><div class="step"><h3>1. Which fund are you with?</h3><p class="muted">Check a payslip, your fund app or myGov/ATO if you are unsure.</p><div class="choices">${funds().map(x=>`<button class="choice" data-pick-fund="${x.fund}">${x.fund}</button>`).join('')}<button class="choice">I don't know</button></div></div><div class="step"><h3>2. Which investment option are you in?</h3><p class="muted">Often called Balanced, High Growth, Indexed or a lifecycle option.</p><div id="pickOptions" class="choices"><span class="muted">Choose a fund first.</span></div></div><div class="step"><h3>3. What is your super balance?</h3><div class="field" style="max-width:220px"><label>Balance</label><input id="balance" type="number" step="1000" value="${bal()}"></div></div></div>${o?`<div class="saved"><h2>Your saved super</h2><div><b>Fund</b>${o.fund}</div><div><b>Investment option</b>${o.option}</div><div><b>Balance</b>${money(bal())}</div><p><button class="btn" data-option="${o.id}">View my option</button></p></div>`:''}</div>`}
function fundList(){return `<div class="page"><div class="eyebrow">Funds</div><h1>Australian super funds</h1><p class="lead">Browse a provider, then see its products and investment options.</p><table><thead><tr><th>Fund</th><th>Options loaded</th><th>Coverage</th><th></th></tr></thead><tbody>${funds().map(o=>`<tr><td><div class="primary">${o.fund}</div><div class="sub">${[...new Set(db.options.filter(x=>x.fund===o.fund).map(x=>x.product))].join(', ')}</div></td><td>${db.options.filter(x=>x.fund===o.fund).length}</td><td>Prototype</td><td><button class="link" data-fund="${o.fund}">View →</button></td></tr>`).join('')}</tbody></table><div class="notice" style="margin-top:20px">The final directory will contain every available fund. We will not fill it with incomplete placeholder records merely to make the prototype look larger.</div></div>`}
function fundPage(){let os=db.options.filter(o=>o.fund===state.fund);return `<div class="page"><div class="crumb"><button data-go="funds">Funds</button> / ${state.fund}</div><div class="eyebrow">Super fund</div><h1>${state.fund}</h1><p class="lead">Products and investment options currently loaded in the verified prototype dataset.</p><section class="section"><h2>Investment options</h2><table><thead><tr><th>Option</th><th>Growth</th><th>10-year return</th><th>Investment cost</th><th></th></tr></thead><tbody>${os.map(o=>`<tr><td><div class="primary">${o.option}</div><div class="sub">${o.product} · ${o.style}</div></td><td>${pct(o.growth)}</td><td>${pct(o.performance['10y'].value)} p.a.</td><td>${pct(o.costs.investmentAndTransactionPct.value)}</td><td><button class="link" data-option="${o.id}">View →</button></td></tr>`).join('')}</tbody></table></section></div>`}
function row(n,v,s=''){return `<div class="row"><span>${n}</span><strong>${v}</strong><span>${s}</span></div>`}function allocation(o){let s=o.strategic['2026']||Object.values(o.strategic).at(-1);return `<table><thead><tr><th>Asset class</th><th>Strategic allocation</th></tr></thead><tbody>${s.allocation.filter(x=>x[1]>0).map(x=>`<tr><td>${x[0]}</td><td>${pct(x[1])}</td></tr>`).join('')}</tbody></table><p class="sub">Effective ${s.effective}. <a href="${db.sources[s.source].url}" target="_blank">Open source ↗</a></p>`}
function optionPage(){let o=opt(state.option||db.options[0].id),f=fees(o,bal());return `<div class="page"><div class="crumb"><button data-go="funds">Funds</button> / <button data-fund="${o.fund}">${o.fund}</button> / ${o.option}</div><header class="option-head"><div class="option-top"><div><div class="eyebrow">Investment option</div><h1>${o.option}</h1><div class="muted">${o.fund} · ${o.product} · ${o.style}</div></div><button class="btn alt" data-compare="${o.id}">Compare this option</button></div><p class="option-summary">${o.option} has ${o.growth}% in growth assets and has returned ${pct(o.performance['10y'].value)} p.a. over 10 years to ${db.meta.performanceAsAt}. The fund suggests a ${o.suggestedTimeframe.toLowerCase()} timeframe. Historical returns are not a forecast, and the strategy may have changed during that period.</p><div class="metrics"><div class="metric"><label>10-year return</label><strong>${pct(o.performance['10y'].value)} p.a.</strong><small>Long-term historical result.</small></div><div class="metric"><label>Fees at your balance</label><strong>${money(f.t)} / yr</strong><small>At ${money(bal())}.</small></div><div class="metric"><label>Growth assets</label><strong>${pct(o.growth)}</strong><small>Higher growth usually means more volatility.</small></div><div class="metric"><label>Risk</label><strong>${o.risk}</strong><small>Fund-published description.</small></div><div class="metric"><label>Timeframe</label><strong>${o.suggestedTimeframe}</strong><small>Suggested by the fund.</small></div></div></header><section class="section"><h2>Everything else</h2><p class="muted">Open only the section you need.</p><details open><summary>Returns</summary><div class="detail rows">${['1y','3y','5y','10y'].map(k=>row(k.replace('y',' year'),pct(o.performance[k].value)+(k==='1y'?'':' p.a.'),o.performance[k].status==='secondary_crosscheck'?'<span class="tag">secondary check</span>':'<span class="tag">issuer verified</span>')).join('')}</div></details><details><summary>What you own</summary><div class="detail"><p class="muted">The current strategic mix — what the fund is aiming to hold.</p>${allocation(o)}</div></details><details><summary>Fees at ${money(bal())}</summary><div class="detail rows">${row('Fixed administration',money(f.f))}${row('Asset-based administration',money(f.a))}${row('Investment + transaction',money(f.i))}${row('Costs met from reserves',money(f.r))}${row('Estimated total',money(f.t))}</div></details><details><summary>How the strategy changed</summary><div class="detail rows">${o.history.map(e=>row(`<b>${e.date}</b><br>${e.title}<div class="sub">${e.text}</div>`,e.severity)).join('')}</div></details><details><summary>Sources and verification</summary><div class="detail">${[...new Set([o.performance['10y'].source,...Object.values(o.strategic).map(x=>x.source),o.costs.adminFixedAnnual.source])].map(id=>{let s=db.sources[id];return `<p><b>${s.organisation}</b> — ${s.title}<br><a href="${s.url}" target="_blank">Open public source ↗</a></p>`}).join('')}</div></details></section></div>`}
function compare(){let ids=state.compare.length?state.compare:db.options.slice(0,2).map(o=>o.id),a=opt(ids[0]),b=opt(ids[1]||ids[0]),B=bal(),fa=fees(a,B),fb=fees(b,B),ret=a.performance['10y'].value>b.performance['10y'].value?a:b,cost=fa.t<fb.t?a:b;return `<div class="page"><div class="eyebrow">Compare</div><h1>Compare investment options</h1><p class="lead">Start with five measures. Open more detail only when it helps.</p><div class="compare-select"><div class="field"><label>First option</label><select id="ca">${sel(a.id)}</select></div><div class="vs">vs</div><div class="field"><label>Second option</label><select id="cb">${sel(b.id)}</select></div></div><div class="compare">${crow('10-year return',pct(a.performance['10y'].value)+' p.a.',pct(b.performance['10y'].value)+' p.a.')}${crow('Fees at your balance',money(fa.t),money(fb.t))}${crow('Growth assets',pct(a.growth),pct(b.growth))}${crow('Risk',a.risk,b.risk)}${crow('Suggested timeframe',a.suggestedTimeframe,b.suggestedTimeframe)}</div><div class="interpret"><b>What stands out</b><br>${ret.shortFund} has the higher historical 10-year return in this comparison. ${cost.shortFund} has the lower estimated disclosed cost at ${money(B)}. The growth allocations also differ (${a.growth}% vs ${b.growth}%), so this is not a pure manager-skill comparison.</div><details><summary>Returns over 1, 3, 5 and 10 years</summary><div class="detail compare">${['1y','3y','5y','10y'].map(k=>crow(k.replace('y',' year'),pct(a.performance[k].value),pct(b.performance[k].value))).join('')}</div></details><details><summary>What each option owns</summary><div class="detail"><p class="muted">Full asset-class comparison will normalise fund labels into a common taxonomy as coverage expands.</p></div></details><details><summary>Full fee breakdown</summary><div class="detail compare">${crow('Estimated annual total',money(fa.t),money(fb.t))}${crow('Investment + transaction',money(fa.i),money(fb.i))}</div></details><details><summary>Strategy changes</summary><div class="detail compare">${crow('Recorded events',a.history.length,b.history.length)}</div></details><details><summary>Sources and verification</summary><div class="detail notice">The production comparison will expose the evidence behind every row, not just a generic source list.</div></details></div>`}
function sel(id){return db.options.map(o=>`<option value="${o.id}" ${o.id===id?'selected':''}>${o.fund} — ${o.option}</option>`).join('')}function crow(n,a,b){return `<div class="crow"><div class="name">${n}</div><div><strong>${a}</strong></div><div><strong>${b}</strong></div></div>`}
function rankings(){let m=state.rank||'10y',os=[...db.options].sort((a,b)=>m==='fees'?a.costs.investmentAndTransactionPct.value-b.costs.investmentAndTransactionPct.value:b.performance[m].value-a.performance[m].value);return `<div class="page"><div class="eyebrow">Rankings</div><h1>Rank comparable super options</h1><p class="lead">The final rankings engine will screen by growth exposure, option type, active/indexed style and more before ranking.</p><div class="toolbar"><div class="field"><label>Rank by</label><select id="rank"><option value="10y">10-year return</option><option value="5y">5-year return</option><option value="3y">3-year return</option><option value="fees">Investment cost</option></select></div><div class="field"><label>Growth range</label><select disabled><option>All loaded options</option></select></div><div class="field"><label>Style</label><select disabled><option>All styles</option></select></div></div><div class="notice" style="margin-bottom:18px">Prototype ranks only the tiny loaded sample. These are not Australian-market rankings yet.</div><table><thead><tr><th>Rank</th><th>Option</th><th>Growth</th><th>${m==='fees'?'Investment cost':m.replace('y','-year return')}</th><th></th></tr></thead><tbody>${os.map((o,i)=>`<tr><td><b>${i+1}</b></td><td><div class="primary">${o.option}</div><div class="sub">${o.fund}</div></td><td>${pct(o.growth)}</td><td>${m==='fees'?pct(o.costs.investmentAndTransactionPct.value):pct(o.performance[m].value)+' p.a.'}</td><td><button class="link" data-option="${o.id}">View →</button></td></tr>`).join('')}</tbody></table></div>`}
let topics={intro:['Superannuation in 5 minutes','Super is money invested for your retirement. Your employer contributes to an account and the money is invested rather than simply sitting in cash.<h3>The three things to know first</h3><ul><li><b>Your fund</b> manages the account.</li><li><b>Your investment option</b> decides how the money is invested.</li><li><b>Returns and fees</b> affect how the balance grows.</li></ul>'],options:['What is an investment option?','A super fund can offer many ways to invest: Balanced, High Growth, Conservative, Australian Shares or Indexed. The name alone is not enough; two funds can use the same label while taking different risks.'],growth:['Growth vs defensive assets','Growth assets such as shares are generally intended to drive stronger long-term growth but can fall more sharply. Defensive assets such as cash and some fixed income are generally intended to reduce volatility.'],returns:['How to read returns','A 10-year annualised return is usually more useful than one good year, but it can still be misleading if the strategy changed materially during the period.'],fees:['How super fees work','Fees can include fixed administration, asset-based administration, investment costs, transaction costs and sometimes performance fees. We translate them into dollar costs at your balance.']};function learn(){let t=topics[state.topic];return `<div class="page"><div class="eyebrow">Learn</div><h1>Understand super without learning the jargon first.</h1><div class="section learn"><nav>${Object.entries(topics).map(([k,v])=>`<button class="${k===state.topic?'active':''}" data-topic="${k}">${v[0]}</button>`).join('')}</nav><article class="article"><h2>${t[0]}</h2><p>${t[1]}</p></article></div></div>`}
function render(){let f={home,my,funds:fundList,fund:fundPage,option:optionPage,compare,rankings,learn}[state.view];$('#app').innerHTML=f();bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-option]').forEach(x=>x.onclick=()=>go('option',{option:x.dataset.option}));document.querySelectorAll('[data-fund]').forEach(x=>x.onclick=()=>go('fund',{fund:x.dataset.fund}));document.querySelectorAll('[data-compare]').forEach(x=>x.onclick=()=>go('compare',{compare:[x.dataset.compare,db.options.find(o=>o.id!==x.dataset.compare)?.id]}));document.querySelectorAll('[data-topic]').forEach(x=>x.onclick=()=>{state.topic=x.dataset.topic;render()});document.querySelectorAll('[data-pick-fund]').forEach(x=>x.onclick=()=>pickFund(x.dataset.pickFund));let q=$('#homeQ');if(q)q.oninput=()=>homeSearch(q.value);let a=$('#ca'),b=$('#cb');if(a)a.onchange=()=>go('compare',{compare:[a.value,b.value]});if(b)b.onchange=()=>go('compare',{compare:[a.value,b.value]});let r=$('#rank');if(r){r.value=state.rank||'10y';r.onchange=()=>{state.rank=r.value;render()}}let B=$('#balance');if(B)B.onchange=()=>{localStorage.setItem('se_bal',B.value);render()}}
function pickFund(f){let t=$('#pickOptions');t.innerHTML=db.options.filter(o=>o.fund===f).map(o=>`<button class="choice" data-save="${o.id}">${o.option}</button>`).join('');t.querySelectorAll('[data-save]').forEach(x=>x.onclick=()=>{localStorage.setItem('se_opt',x.dataset.save);render()})}
function homeSearch(q){let t=$('#homeResults'),z=q.trim().toLowerCase();if(!z){t.innerHTML='';return}let os=db.options.filter(o=>(o.fund+' '+o.option+' '+o.product).toLowerCase().includes(z)).slice(0,7);t.innerHTML=`<div class="results">${os.map(o=>`<div class="result" data-option="${o.id}"><div><b>${o.option}</b><small>${o.fund} · ${o.product}</small></div>→</div>`).join('')}</div>`;t.querySelectorAll('[data-option]').forEach(x=>x.onclick=()=>go('option',{option:x.dataset.option}))}
function search(q){let z=q.trim().toLowerCase(),items=[];funds().filter(o=>!z||o.fund.toLowerCase().includes(z)).forEach(o=>items.push(['Fund',o.fund,()=>go('fund',{fund:o.fund})]));db.options.filter(o=>!z||(o.fund+' '+o.option).toLowerCase().includes(z)).forEach(o=>items.push(['Investment option',o.fund+' — '+o.option,()=>go('option',{option:o.id})]));$('#dlgResults').innerHTML=items.slice(0,14).map((x,i)=>`<div class="result" data-i="${i}"><div><small>${x[0]}</small><b>${x[1]}</b></div>→</div>`).join('');$('#dlgResults').querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{items[+x.dataset.i][2]();$('#searchDlg').close()})}
$('#searchOpen').onclick=()=>{$('#searchDlg').showModal();$('#dlgInput').value='';search('');setTimeout(()=>$('#dlgInput').focus(),10)};$('#searchClose').onclick=()=>$('#searchDlg').close();$('#dlgInput').oninput=e=>search(e.target.value);
fetch('./data/options.json').then(r=>r.json()).then(x=>{db=x;state.option=localStorage.getItem('se_opt')||x.options[0].id;state.compare=x.options.slice(0,2).map(o=>o.id);render()});
</script></body></html>
