<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Independent, evidence-backed comparison and economic analysis of Australian superannuation funds and investment options." />
  <title>Super Evidence — Understand and compare Australian super</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <button class="brand" data-view="home" aria-label="Super Evidence home">
        <span class="brand-mark">SE</span>
        <span class="brand-name">Super Evidence</span>
      </button>
      <nav class="desktop-nav" aria-label="Main navigation">
        <button data-view="my" class="nav-link">My super</button>
        <button data-view="compare" class="nav-link">Compare</button>
        <button data-view="rankings" class="nav-link">Rankings</button>
        <button data-view="analysis" class="nav-link">Analysis</button>
        <button data-view="funds" class="nav-link">Funds</button>
        <button data-view="learn" class="nav-link">Learn</button>
      </nav>
      <button id="globalSearchButton" class="search-button" aria-haspopup="dialog">Search</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-shell">
      <div>
        <strong>Super Evidence</strong>
        <p>Independent, evidence-backed Australian superannuation research.</p>
      </div>
      <p>Factual information only. Not personal financial advice. Past performance is not a reliable indicator of future performance.</p>
    </div>
  </footer>

  <dialog id="searchDialog" class="search-dialog">
    <div class="dialog-head">
      <div>
        <span class="eyebrow">Search</span>
        <strong>Find a fund or investment option</strong>
      </div>
      <button id="closeSearch" class="icon-button" aria-label="Close search">×</button>
    </div>
    <input id="dialogSearchInput" class="dialog-search-input" type="search" placeholder="Try ‘ART High Growth’ or ‘Aware Super’" autocomplete="off" />
    <div id="dialogSearchResults" class="dialog-results"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
